# PRODUCTION DEPLOY — auto on push/merge to main; also manually dispatchable.
#
# Requires the Pages source to be set to "GitHub Actions" (repo Settings ->
# Pages). While the source is "branch: gh-pages" this workflow runs but does
# not affect the live site (owner action to switch, not scriptable here).
#
# See docs/engineering/branching-and-deploys.md (DL-008, DL-052).

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Design-token contrast check
        run: npm run check:contrast

      - name: Build
        run: npm run build
        env:
          # Read-only PAT for the contribution-calendar snapshot (R3-D). Falls
          # back to a plain GitHub link if the secret is absent — never fails.
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4