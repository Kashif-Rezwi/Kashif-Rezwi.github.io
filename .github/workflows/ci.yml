# Build check for the portfolio rebuild (Phase 1.0+).
# Runs on pushes/PRs touching the site on develop AND main. Preview deploys are
# separate (companion repo Kashif-Rezwi/portfolio-preview — see
# docs/engineering/branching-and-deploys.md).

name: CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.github/workflows/**'
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Design-token contrast check
        run: npm run check:contrast

      - name: Build (production base)
        run: npm run build
        env:
          # Read-only PAT for the contribution-calendar snapshot (R3-D).
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}